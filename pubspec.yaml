name: beomora
description: "Beomora - Aplikasi belajar bahasa dengan gamifikasi."
publish_to: 'none'
version: 1.5.0+14

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_tts: ^4.2.0
  confetti: ^0.8.0
  # Login/daftar hanya lewat akun Google via Firebase Authentication;
  # profil pengguna disimpan di Cloud Firestore.
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.0
  cloud_firestore: ^6.9.0
  # Penyedia ID token Google di Android/iOS (web pakai popup Firebase).
  google_sign_in: ^7.2.0
  in_app_purchase: ^3.3.0
  # Akses detail pembelian Android (obfuscatedAccountId) untuk
  # mengikat langganan ke akun Beomora yang membeli.
  in_app_purchase_android: ^0.5.0
  google_mobile_ads: ^9.1.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/content/

# Ikon launcher Android — dibuat dari store_assets (tool/render_store_assets_test.dart).
# Regenerasi: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "store_assets/icon_1024.png"
  adaptive_icon_background: "#F1ECDC"
  adaptive_icon_foreground: "store_assets/icon_foreground.png"
